services:
  - type: web
    name: asaba-chop-grill-bot
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 18.20.0
      - key: GEMINI_API_KEY
        sync: false
